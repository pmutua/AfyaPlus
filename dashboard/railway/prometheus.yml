global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: afyaplus_api
    metrics_path: /metrics
    static_configs:
      - targets: ["afyaplus-rag-agent.railway.internal:8080"]

  - job_name: afyaplus_dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard.railway.internal:8000"]
